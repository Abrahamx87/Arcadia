<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Arcadia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css?v=0.12">
</head>
<body>

<!-- ================= Biblioteca ================= -->
<section id="library" class="screen">
  <header class="lib-top">
    <h1>Biblioteca <span class="ver" id="app-version"></span></h1>
    <button class="icon-btn" data-soon="sync" aria-label="Sincronizar"><svg class="i"><use href="#ic-sync"/></svg></button>
  </header>
  <div class="lib-scroll">
    <button class="banner" data-soon="sync">
      <svg class="i" style="width:34px;height:34px"><use href="#ic-cloud-up"/></svg>
      <div><b>Abraham IA Music</b><span>Pronto: sincroniza tus canciones de la web con Arcadia</span></div>
    </button>
    <div class="shortcuts">
      <button class="shortcut" data-filter="mine"><svg class="i"><use href="#ic-person"/></svg>Mis proyectos</button>
      <button class="shortcut" data-filter="trash"><svg class="i"><use href="#ic-delete"/></svg>Eliminados</button>
    </div>
    <div class="list-head">
      <h2 id="list-title">Todo</h2>
      <button class="new-btn" id="new-project"><svg class="i sm"><use href="#ic-add"/></svg>Nuevo</button>
    </div>
    <div id="project-list"></div>
  </div>
</section>

<!-- ================= Estudio ================= -->
<section id="studio" class="screen hidden">
  <header class="studio-top">
    <button class="icon-btn" id="back" aria-label="Volver"><svg class="i"><use href="#ic-exit"/></svg></button>
    <button class="titles" id="title-btn">
      <h2 id="studio-title"></h2>
      <div class="sub" id="studio-sub"></div>
    </button>
    <button class="icon-btn" data-soon="sync" aria-label="Sincronizar"><svg class="i"><use href="#ic-cloud-up"/></svg></button>
    <button class="icon-btn" id="menu" aria-label="Opciones del proyecto"><svg class="i"><use href="#ic-more"/></svg></button>
  </header>

  <div class="tl-wrap">
    <div class="timeline" id="timeline">
      <div class="tl-inner" id="tl-inner">
        <div class="ruler-row">
          <div class="corner"><span id="t-now">00:00<small>.0</small></span></div>
          <div class="ruler" id="ruler"></div>
          <button class="snap-btn" id="snap-btn" aria-label="Imán: ajustar a la cuadrícula"><svg class="i sm"><use href="#ic-magnet"/></svg></button>
        </div>
        <div id="tracks"></div>
        <div class="add-row"><button class="add-btn" id="add-track" aria-label="Agregar pista"><svg class="i"><use href="#ic-add"/></svg></button></div>
      </div>
    </div>
    <div class="playhead" id="playhead"></div>
    <div class="mixer hidden" id="mixer"></div>
  </div>

  <footer class="bottom">
    <div id="editbar" class="editbar hidden">
      <div class="rlabel" id="region-label"></div>
      <button class="chip-btn" id="r-split"><svg class="i sm"><use href="#ic-cut"/></svg>Dividir</button>
      <button class="chip-btn" id="r-dup"><svg class="i sm"><use href="#ic-copy"/></svg>Duplicar</button>
      <button class="chip-btn" id="r-rename"><svg class="i sm"><use href="#ic-edit"/></svg>Nombre</button>
      <button class="chip-btn" id="r-del"><svg class="i sm"><use href="#ic-delete"/></svg>Borrar</button>
      <button class="icon-btn" id="r-close" aria-label="Quitar selección"><svg class="i"><use href="#ic-close"/></svg></button>
    </div>
    <div class="toolbar">
      <div class="tool-pill">
        <button id="tb-mic" aria-label="Nueva pista de voz"><svg class="i"><use href="#ic-mic"/></svg></button>
        <button id="open-fx" class="fx-tool" aria-label="Efectos"><i>Fx</i></button>
        <button id="import-btn" class="tool-text"><svg class="i"><use href="#ic-upload"/></svg>Importar</button>
      </div>
      <div class="spacer"></div>
      <button class="round-btn" id="tb-export" aria-label="Exportar canción"><svg class="i"><use href="#ic-download"/></svg></button>
    </div>
    <div class="transport">
      <button class="tbtn" id="open-mixer" aria-label="Mezclador"><svg class="i"><use href="#ic-tune"/></svg></button>
      <button class="tbtn" id="undo" aria-label="Deshacer"><svg class="i"><use href="#ic-undo"/></svg></button>
      <button class="tbtn" id="rewind" aria-label="Al inicio"><svg class="i"><use href="#ic-prev"/></svg></button>
      <button class="rec-btn" id="record" aria-label="Grabar"></button>
      <button class="tbtn play" id="play" aria-label="Reproducir"><svg class="i"><use href="#ic-play" id="play-icon"/></svg></button>
      <button class="tbtn" id="redo" aria-label="Rehacer"><svg class="i"><use href="#ic-redo"/></svg></button>
      <button class="tbtn" id="tb-metro" aria-label="Metrónomo"><svg class="i"><use href="#ic-metro"/></svg></button>
    </div>
  </footer>
</section>

<input type="file" id="file-input" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac,.aac" multiple hidden>
<div id="overlay"></div>
